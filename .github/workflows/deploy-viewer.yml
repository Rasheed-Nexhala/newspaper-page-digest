name: Deploy viewer to Firebase Hosting

# Rebuilds whenever Top 5 JSON (or the viewer) lands on main.
on:
  push:
    branches: [main]
    paths:
      - 'work/**/Daily_top/**'
      - 'work/**/Coastal_Katte/CoastalKatte_Top5_*.json'
      - 'work/**/Full_paper/**'
      - 'viewer/**'
      - '.github/workflows/deploy-viewer.yml'
      - 'firebase.json'
      - '.firebaserc'
      - 'firestore.rules'
      - 'firestore.indexes.json'
  workflow_dispatch:

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install
        working-directory: viewer
        run: npm ci

      - name: Build static viewer
        working-directory: viewer
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: newspaper-page-digest

      - name: Authenticate for Firebase CLI
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules and indexes
        run: npx -y firebase-tools@latest deploy --only firestore --project newspaper-page-digest --non-interactive

      - name: Deploy Auth config
        run: npx -y firebase-tools@latest deploy --only auth --project newspaper-page-digest --non-interactive
