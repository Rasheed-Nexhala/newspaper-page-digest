name: Deploy viewer to GitHub Pages

# Rebuilds whenever Top 5 JSON (or the viewer) lands on main.
on:
  push:
    branches: [main]
    paths:
      - 'work/**/Daily_top/**'
      - 'work/**/Coastal_Katte/CoastalKatte_Top5_*.json'
      - 'work/**/Full_paper/**'
      - 'viewer/**'
      - '.github/workflows/deploy-viewer.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install
        working-directory: viewer
        run: npm ci

      - name: Build static viewer
        working-directory: viewer
        env:
          # Project Pages URL: https://<owner>.github.io/newspaper-page-digest/
          VITE_BASE: /newspaper-page-digest/
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
